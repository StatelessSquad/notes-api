[tool.poetry]
name = "notes-api"
version = "0.1.0"
description = "tiny personal notes service"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "notes_api", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.110.0"
sqlmodel = "^0.0.18"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
httpx = ">=0.27,<0.29"
pydantic = "1.10.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pre-commit = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
